version: 1

kind: 37770

staging:
  path: ./.kjvonly

nostr:
  relays:
    - ws://localhost:13334

defaults:
  strategy: local

strategies:
  local:
    type: blossom
    urls:
      - http://localhost:13335

resources:
  bible-chapters-kjv:
    path: ./data/bible/chapters/content/kjv
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapters/kjv/${key}"]
        - ["m", "application/json+gzip+hex"]
        - ["t", "kjvonly/bible/chapters"]
        - ["representation", "content"]
        - ["language", "en"]

  bible-chapters-kjvs:
    path: ./data/bible/chapters/content/kjvs
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapters/kjvs/${key}"]
        - ["m", "application/json+gzip+hex"]
        - ["t", "kjvonly/bible/chapters"]
        - ["representation", "content"]
        - ["language", "en"]

  bible-bundle-kjv:
    path: ./data/bible/chapters/bundles/kjv.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapters/kjv"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/bible/chapters"]
        - ["representation", "descriptors"]
        - ["language", "en"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-bundle-kjvs:
    path: ./data/bible/chapters/bundles/kjvs.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapters/kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/bible/chapters"]
        - ["representation", "descriptors"]
        - ["language", "en"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-paragraphs:
    path: ./data/bible/overlays/paragraphs/bundles/default.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/overlays/paragraphs/default"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/overlays/paragraphs"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-pericopes:
    path: ./data/bible/overlays/pericopes/bundles/default.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/overlays/pericopes/default"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/overlays/pericopes"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-index-kjv:
    path: ./data/bible/indexes/bible/bundles/kjv.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/search/bible/kjv"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/search/bible"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-booknames:
    path: ./data/bible/metadata/booknames/bundles/default.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/booknames/default"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/bible/booknames"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  strongs-kjvs:
    path: ./data/strongs/definitions/bundles/kjvs.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/strongs/definitions/kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/strongs/definitions"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

collections:
  application-defaults:
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/resources/collections/default"]
        - ["m", "application/json+hex"]
        - ["t", "kjvonly/resources/collections"]
        - ["representation", "descriptors"]
    resources:
      - bible-bundle-kjvs
      - bible-paragraphs
      - bible-pericopes
      - bible-index-kjv
      - bible-booknames
      - strongs-kjvs
