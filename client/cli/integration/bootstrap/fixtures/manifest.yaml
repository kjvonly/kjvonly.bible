version: 1

kind: 37770

staging:
  path: ./.kjvonly

nostr:
  relays:
    - ws://localhost:13334

defaults:
  strategy: local

strategies:
  local:
    type: blossom
    urls:
      - http://localhost:13335

resources:
  bible-chapters-kjv:
    path: ./data/bible/chapters/content/kjv
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapter/kjv/${key}"]
        - ["m", "application/json+gzip+hex"]
        - ["t", "bible/chapter"]
        - ["dataType", "kjvonly.bible.chapter"]
        - ["dataVersion", "1"]
        - ["representation", "content"]
        - ["version", "kjv"]
        - ["language", "en"]

  bible-chapters-kjvs:
    path: ./data/bible/chapters/content/kjvs
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapter/kjvs/${key}"]
        - ["m", "application/json+gzip+hex"]
        - ["t", "bible/chapter"]
        - ["dataType", "kjvonly.bible.chapter"]
        - ["dataVersion", "1"]
        - ["representation", "content"]
        - ["version", "kjvs"]
        - ["language", "en"]

  bible-bundle-kjv:
    path: ./data/bible/chapters/bundles/kjv.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapter/kjv"]
        - ["m", "application/json+hex"]
        - ["t", "bible/chapter"]
        - ["dataType", "kjvonly.bible.chapter"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
        - ["version", "kjv"]
        - ["language", "en"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-bundle-kjvs:
    path: ./data/bible/chapters/bundles/kjvs.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/chapter/kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "bible/chapter"]
        - ["dataType", "kjvonly.bible.chapter"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
        - ["version", "kjvs"]
        - ["language", "en"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-paragraphs:
    path: ./data/bible/overlays/paragraphs/bundles/default.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/paragraphs/default"]
        - ["m", "application/json+hex"]
        - ["t", "bible/paragraphs"]
        - ["dataType", "kjvonly.bible.paragraphs"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-pericopes:
    path: ./data/bible/overlays/pericopes/bundles/default.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/pericopes/default"]
        - ["m", "application/json+hex"]
        - ["t", "bible/pericopes"]
        - ["dataType", "kjvonly.bible.pericopes"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-index-kjv:
    path: ./data/bible/indexes/bible/bundles/kjv.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/search-index/kjv"]
        - ["m", "application/json+hex"]
        - ["t", "bible/search-index"]
        - ["dataType", "kjvonly.bible.search-index"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  bible-booknames:
    path: ./data/bible/metadata/booknames/bundles/default.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/bible/booknames/default"]
        - ["m", "application/json+hex"]
        - ["t", "bible/booknames"]
        - ["dataType", "kjvonly.bible.booknames"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

  strongs-kjvs:
    path: ./data/strongs/definitions/bundles/kjvs.json.gz
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/strongs/definition/kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "strongs/definition"]
        - ["dataType", "kjvonly.strongs.definition"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
    object-upload:
      mediaType: application/json+gzip
      encoding: []

collections:
  application-defaults:
    event:
      encoding:
        - hex
      tags:
        - ["d", "kjvonly/resources/collections/default"]
        - ["m", "application/json+hex"]
        - ["t", "resource/descriptor-collection"]
        - ["dataType", "kjvonly.resource-descriptor-collection"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
    resources:
      - bible-bundle-kjvs
      - bible-paragraphs
      - bible-pericopes
      - bible-index-kjv
      - bible-booknames
      - strongs-kjvs
