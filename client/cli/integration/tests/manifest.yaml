version: 1

kind: 37770

staging:
  path: ./.kjvonly

nostr:
  relays:
    - wss://relay.example

resources:
  test-bible-chapter:
    path: ./data/1_1.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/bible/chapter/test/${key}"]
        - ["m", "application/json+gzip+hex"]
        - ["t", "bible/chapter"]
        - ["dataType", "kjvonly.bible.chapter"]
        - ["dataVersion", "1"]
        - ["representation", "content"]
        - ["version", "test"]

collections: {}