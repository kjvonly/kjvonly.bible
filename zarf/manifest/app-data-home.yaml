version: 1

kind: 37770

staging:
  path: ./.kjvonly-home

nostr:
  relays:
    - wss://kjvonly.bible.home:3334

defaults:
  strategy: local

strategies:
  local:
    type: blossom
    urls:
      - https://kjvonly.bible.home:3335

resources:

  # ---------------------------------------------------------------------------
  # Bible Chapters - KJVS - Individual
  # ---------------------------------------------------------------------------

  bible-chapters-kjvs:
    path: ../../data/bible/chapters/content/kjvs

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/bible/chapter/kjvs/${key}"]
        - ["m", "application/json+gzip+hex"]
        - ["t", "bible/chapter"]
        - ["dataType", "kjvonly.bible.chapter"]
        - ["dataVersion", "1"]
        - ["representation", "content"]
        - ["version", "kjvs"]

  # ---------------------------------------------------------------------------
  # Bible Chapters - KJVS - Bundle
  # ---------------------------------------------------------------------------

  bible-bundle-kjvs:
    path: ../../data/bible/chapters/bundles/kjvs.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/bible/chapter/kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "bible/chapter"]
        - ["dataType", "kjvonly.bible.chapter"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]
        - ["version", "kjvs"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

  # ---------------------------------------------------------------------------
  # Bible Search Index - KJVS
  # ---------------------------------------------------------------------------

  bible-search-kjvs:
    path: ../../data/bible/indexes/bible/bundles/bibleindex.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/bible/search-index/kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "bible/search-index"]
        - ["dataType", "kjvonly.bible.search-index"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

  # ---------------------------------------------------------------------------
  # Bible Paragraph Overlay
  # ---------------------------------------------------------------------------

  bible-paragraphs:
    path: ../../data/bible/overlays/paragraphs/bundles/paragraphs.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/bible/paragraphs/default"]
        - ["m", "application/json+hex"]
        - ["t", "bible/paragraphs"]
        - ["dataType", "kjvonly.bible.paragraphs"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

  # ---------------------------------------------------------------------------
  # Bible Pericope Overlay
  # ---------------------------------------------------------------------------

  bible-pericopes:
    path: ../../data/bible/overlays/pericopes/bundles/pericopes.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/bible/pericopes/default"]
        - ["m", "application/json+hex"]
        - ["t", "bible/pericopes"]
        - ["dataType", "kjvonly.bible.pericopes"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

  # ---------------------------------------------------------------------------
  # Bible Book Names
  # ---------------------------------------------------------------------------

  bible-booknames:
    path: ../../data/bible/metadata/booknames/bundles/booknames.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/bible/booknames/default"]
        - ["m", "application/json+hex"]
        - ["t", "bible/booknames"]
        - ["dataType", "kjvonly.bible.booknames"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

  # ---------------------------------------------------------------------------
  # Strong's Definitions - Bundle
  #
  # Individual Strong's Resources are intentionally omitted from the
  # development manifest. They can be added for production publication.
  # ---------------------------------------------------------------------------

  strongs-kjvs:
    path: ../../data/strongs/definitions/bundles/strongs.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/strongs/definition/kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "strongs/definition"]
        - ["dataType", "kjvonly.strongs.definition"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

  # ---------------------------------------------------------------------------
  # Reading Plans - Default - Individual
  # ---------------------------------------------------------------------------

  plans-readings-default-items:
    path: ../../data/plans/readings/default

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/reading-plans/plan-definition/default/${key}"]
        - ["m", "application/json+hex"]
        - ["t", "reading-plans/plan-definition"]
        - ["dataType", "kjvonly.reading-plan.definition"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

collections:

  # ---------------------------------------------------------------------------
  # Reading Plans - Default
  # ---------------------------------------------------------------------------

  plans-readings-default:
    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/reading-plans/plan-definition/default"]
        - ["m", "application/json+hex"]
        - ["t", "reading-plans/plan-definition"]
        - ["dataType", "kjvonly.reading-plan.definition"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    resources:
      - plans-readings-default-items

  # ---------------------------------------------------------------------------
  # Application Bootstrap Defaults
  # ---------------------------------------------------------------------------

  application-defaults:
    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/resources/collections/default"]
        - ["m", "application/json+hex"]
        - ["t", "resource/descriptor-collection"]
        - ["dataType", "kjvonly.resource-descriptor-collection"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    resources:
      - bible-bundle-kjvs
      - bible-search-kjvs
      - bible-paragraphs
      - bible-pericopes
      - bible-booknames
      - strongs-kjvs

    collections:
      - plans-readings-default