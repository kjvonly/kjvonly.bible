version: 1

kind: 37770

staging:
  path: ./.kjvonly-dictionary-strongs-home

nostr:
  relays:
    - wss://kjvonly.bible.home:3334

defaults:
  strategy: local

strategies:
  local:
    type: blossom
    urls:
      - https://kjvonly.bible.home:3335

resources:

  dictionary-strongs-kjvs:
    path: ../../data/dictionary/entries/bundles/strongs-kjvs.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/dictionary/entries/strongs-kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "dictionary/entries"]
        - ["dataType", "kjvonly.dictionary.entries"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []

  dictionary-search-strongs-kjvs:
    path: ../../data/dictionary/indexes/bundles/strongs-kjvs.json.gz

    event:
      encoding:
        - hex

      tags:
        - ["d", "kjvonly/dictionary/search-index/strongs-kjvs"]
        - ["m", "application/json+hex"]
        - ["t", "dictionary/search-index"]
        - ["dataType", "kjvonly.dictionary.headword-index"]
        - ["dataVersion", "1"]
        - ["representation", "descriptors"]

    object-upload:
      mediaType: application/json+gzip
      encoding: []
