services:
  postgres:
    image: postgres:18.1-bookworm
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 45s
      retries: 10

  seaweedfs-master:
    image: chrislusf/seaweedfs:4.48
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0 -mdir=/data
    ports:
      - "${SEAWEEDFS_MASTER_PORT}:9333"
    volumes:
      - seaweedfs_master_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.48
    command: volume -ip=seaweedfs-volume -ip.bind=0.0.0.0 -master=seaweedfs-master:9333 -dir=/data
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.48
    command: filer -ip=seaweedfs-filer -ip.bind=0.0.0.0 -master=seaweedfs-master:9333 -defaultStoreDir=/data
    ports:
      - "${SEAWEEDFS_FILER_PORT}:8888"
    volumes:
      - seaweedfs_filer_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.48
    command: s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0
    ports:
      - "${SEAWEEDFS_S3_PORT}:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        buckets="$$(echo 's3.bucket.list' | weed shell -master=seaweedfs-master:9333 -filer=seaweedfs-filer:8888)"
        if printf '%s\n' "$$buckets" | grep -Eq "^[[:space:]]*$${S3_BUCKET}[[:space:]]"; then
          exit 0
        fi
        echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=seaweedfs-master:9333 -filer=seaweedfs-filer:8888
    restart: "no"

  relay:
    build:
      context: ../../server
      dockerfile: relay/Dockerfile
    ports:
      - "${RELAY_PORT}:3334"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${RELAY_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  blossom:
    build:
      context: ../../server
      dockerfile: blossom/Dockerfile
    ports:
      - "${BLOSSOM_PORT}:3335"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${BLOSSOM_DB}?sslmode=disable
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../../client
      dockerfile: pwa/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
        APP_GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_GIT_TAG: ${GIT_TAG:-}
      secrets:
        - build_env
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:

secrets:
  build_env:
    file: ./web.env
